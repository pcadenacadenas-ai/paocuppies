<body class="bg-brand-dark text-slate-100 min-h-screen font-sans pb-24">

    <!-- Header / Navbar -->

        <div class="max-w-5xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-brand-pink to-brand-gold p-0.5 shadow-lg flex items-center justify-center text-white text-lg">
                    <i class="fa-solid fa-cake-candles"></i>
                </div>
                <div>
                    <h1 class="font-serif font-bold text-xl leading-tight text-white">Paocuppies</h1>
                    <p class="text-xs text-slate-400 flex items-center gap-1 font-medium">
                        <i class="fa-solid fa-location-dot text-brand-pink text-[10px]"></i> EL TIGRE, ANZOÁTEGUI
                    </p>
                </div>
            </div>

            <div class="flex items-center gap-2">

                    <span id="edit-btn-text">Modo Edición</span>
                </button>

                <button onclick="openCart()" class="relative px-3 py-1.5 rounded-full bg-brand-pink text-white font-bold text-xs flex items-center gap-1.5 shadow-lg shadow-brand-pink/30">
                    <i class="fa-solid fa-basket-shopping"></i>
                    <span>Pedido</span>
                    <span id="cart-badge" class="bg-brand-gold text-black text-[10px] font-extrabold w-4 h-4 rounded-full flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 pt-4 space-y-6">
        <div class="text-center py-1">
            <span class="inline-block px-4 py-1 rounded-full bg-brand-berry/30 border border-brand-pink/30 text-brand-pink text-xs font-bold uppercase tracking-wider">
                ✨ Amor y arte en cada detalle
            </span>
        </div>

        <!-- Category Pills -->
        <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-none text-xs font-semibold">
            <button onclick="filterCategory('Todas')" class="cat-pill active px-4 py-2 rounded-xl bg-brand-pink text-white whitespace-nowrap shadow-md">Todas</button>
            <button onclick="filterCategory('Tortas')" class="cat-pill px-4 py-2 rounded-xl bg-brand-card text-slate-300 hover:text-white border border-white/10 whitespace-nowrap">Tortas</button>
            <button onclick="filterCategory('Postres')" class="cat-pill px-4 py-2 rounded-xl bg-brand-card text-slate-300 hover:text-white border border-white/10 whitespace-nowrap">Postres</button>
            <button onclick="filterCategory('Papelería Creativa')" class="cat-pill px-4 py-2 rounded-xl bg-brand-card text-slate-300 hover:text-white border border-white/10 whitespace-nowrap">Papelería Creativa</button>
            <button onclick="filterCategory('Combos')" class="cat-pill px-4 py-2 rounded-xl bg-brand-card text-slate-300 hover:text-white border border-white/10 whitespace-nowrap">Combos</button>
            <button onclick="filterCategory('Decoraciones')" class="cat-pill px-4 py-2 rounded-xl bg-brand-card text-slate-300 hover:text-white border border-white/10 whitespace-nowrap">Decoraciones</button>
        </div>

        <div id="add-prod-container" class="hidden flex justify-end">
            <button onclick="openEditModal()" class="px-3 py-1.5 rounded-xl bg-emerald-600 text-white text-xs font-bold flex items-center gap-1.5 shadow-lg">
                <i class="fa-solid fa-plus"></i> Agregar Nuevo Producto
            </button>
        </div>

        <!-- Products Grid -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
    </main>

                    </button>
                    <button onclick="selectPortion(25, 50)" id="port-25" class="portion-btn p-2.5 rounded-2xl border border-white/10 bg-brand-dark/60 text-center">

                    </button>

                        <span class="text-slate-300">Chocolate</span><input type="radio" name="classic-fill" value="Chocolate" class="accent-brand-pink w-4 h-4" checked>

    <!-- Modal Carrito -->

        let products = defaultProducts;
        let cart = [];
        let isEditMode = false;
        let selectedCategory = 'Todas';
        let selectedPortion = { pers: 15, price: 45 };

        function initApp() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('admin') === '1') {
                const editBtn = document.getElementById('edit-toggle-btn');
                editBtn.classList.remove('hidden');
                editBtn.classList.add('flex');
            }
            renderProducts();
            selectPortion(15, 45);
        }

        function filterCategory(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-pill').forEach(btn => {
                if(btn.innerText.trim() === cat) {
                    btn.className = 'cat-pill active px-4 py-2 rounded-xl bg-brand-pink text-white whitespace-nowrap shadow-md';
                } else {
                    btn.className = 'cat-pill px-4 py-2 rounded-xl bg-brand-card text-slate-300 hover:text-white border border-white/10 whitespace-nowrap';
                }
            });
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            const filtered = selectedCategory === 'Todas' ? products : products.filter(p => p.category === selectedCategory);
            if(filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-xs">No hay productos en esta categoría.</div>`;
                return;
            }
            grid.innerHTML = filtered.map(p => `
                <div class="bg-brand-card border border-brand-berry/30 rounded-3xl overflow-hidden shadow-xl flex flex-col relative group">
                    <div class="absolute top-3 left-3 z-10">
                        <span class="px-2.5 py-0.5 rounded-full bg-brand-dark/80 backdrop-blur-md text-brand-gold font-extrabold text-[10px] uppercase border border-brand-gold/30">${p.category}</span>
                    </div>
                    <div class="h-44 overflow-hidden relative bg-brand-dark">
                        <img src="${p.img}" alt="${p.name}" class="w-full h-full object-contain bg-brand-dark group-hover:scale-105 transition-transform duration-300">
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                        <div>
                            <div class="flex items-start justify-between gap-1 mb-1">
                                <h4 class="font-serif font-bold text-white text-base leading-snug">${p.name}</h4>
                                <span class="font-extrabold text-brand-gold text-base">$${p.price.toFixed(2)}</span>
                            </div>
                            <p class="text-xs text-slate-300 leading-relaxed line-clamp-2">${p.desc}</p>
                        </div>
                        <button onclick="${p.isCustomBuilder ? 'openBuilderModal()' : `addToCartDirect(${p.id})`}" class="w-full py-2.5 rounded-xl bg-brand-berry/40 hover:bg-brand-pink border border-brand-pink/40 text-white font-bold text-xs flex items-center justify-center gap-2 transition-all">
                            <i class="fa-solid fa-basket-shopping text-brand-pink group-hover:text-white"></i> Agregar al Pedido
                        </button>
                    </div>
                    ${isEditMode ? `
                        <div class="absolute top-2 right-2 flex gap-1 bg-brand-dark p-1 rounded-full border border-white/20 shadow-xl z-20">
                            <button onclick="openEditModal(${p.id})" class="w-7 h-7 rounded-full bg-amber-500 text-white flex items-center justify-center text-xs"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteProduct(${p.id})" class="w-7 h-7 rounded-full bg-rose-600 text-white flex items-center justify-center text-xs"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function selectPortion(pers, price) {
            selectedPortion = { pers, price };
            document.querySelectorAll('.portion-btn').forEach(btn => btn.classList.remove('border-brand-pink', 'bg-brand-berry/40'));
            const selectedBtn = document.getElementById(`port-${pers}`);
            if(selectedBtn) selectedBtn.classList.add('border-brand-pink', 'bg-brand-berry/40');
        }

        function openBuilderModal() { document.getElementById('builder-modal').classList.remove('hidden'); }
        function closeBuilderModal() { document.getElementById('builder-modal').classList.add('hidden'); }

        function addCustomCakeToCart() {
            const flavor = document.getElementById('cake-flavor').value;
            const gourmet = document.getElementById('gourmet-flavor').value;
            const hasTopper = document.getElementById('topper-addon').checked;
            const selectedFillRadio = document.querySelector('input[name="classic-fill"]:checked');
            const selectedFill = selectedFillRadio ? selectedFillRadio.value : 'Chocolate';
            let finalPrice = selectedPortion.price;
            let details = `Bizcocho: ${flavor} | Relleno clásico: ${selectedFill}`;
            if (gourmet !== "Ninguno") { finalPrice += 5.00; details += ` | ${gourmet}`; }
            if (hasTopper) { finalPrice += 3.00; details += ` | +Topper Personalizado ($3)`; }
            cart.push({ id: Date.now(), name: `Torta Personalizada Chantilly (${selectedPortion.pers}+ pers.)`, price: finalPrice, details: details });
            updateCartUI();
            closeBuilderModal();
            openCart();
        }

        function addToCartDirect(id) {
            const p = products.find(x => x.id === id);
            if(p) {
                cart.push({ id: Date.now(), name: p.name, price: p.price, details: p.desc });
                updateCartUI();
                openCart();
            }
        }

        function updateCartUI() {
            document.getElementById('cart-badge').innerText = cart.length;
            const container = document.getElementById('cart-items');
            if(cart.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 text-center py-8">Tu pedido está vacío</p>';
            } else {
                container.innerHTML = cart.map((item, index) => `
                    <div class="bg-brand-dark p-3 rounded-2xl border border-white/5 flex items-start justify-between text-xs space-x-2">
                        <div>
                            <div class="font-bold text-white">${item.name}</div>
                            <div class="text-[11px] text-slate-400 mt-0.5 leading-tight">${item.details}</div>
                            <div class="text-brand-gold font-extrabold mt-1">$${item.price.toFixed(2)}</div>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-rose-400 p-1 hover:text-rose-300"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `).join('');
            }
            document.getElementById('cart-total').innerText = `$${cart.reduce((sum, item) => sum + item.price, 0).toFixed(2)}`;
        }

        function removeFromCart(index) { cart.splice(index, 1); updateCartUI(); }
        function openCart() { document.getElementById('cart-modal').classList.remove('hidden'); }
        function closeCart() { document.getElementById('cart-modal').classList.add('hidden'); }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            document.getElementById('edit-btn-text').innerText = isEditMode ? 'Listo' : 'Modo Edición';
            document.getElementById('add-prod-container').classList.toggle('hidden', !isEditMode);
            renderProducts();
        }

        function openEditModal(id = null) {
            document.getElementById('edit-modal').classList.remove('hidden');
            if(id) {
                const p = products.find(x => x.id === id);
                document.getElementById('modal-title').innerText = 'Editar Producto';
                document.getElementById('edit-id').value = p.id;
                document.getElementById('edit-name').value = p.name;
                document.getElementById('edit-category').value = p.category;
                document.getElementById('edit-price').value = p.price;
                document.getElementById('edit-desc').value = p.desc;
                document.getElementById('edit-img').value = p.img;
            } else {
                document.getElementById('modal-title').innerText = 'Nuevo Producto';
                document.getElementById('edit-id').value = '';
                document.getElementById('edit-name').value = '';
                document.getElementById('edit-category').value = 'Tortas';
                document.getElementById('edit-price').value = '';
                document.getElementById('edit-desc').value = '';
                document.getElementById('edit-img').value = '';
            }
        }

        function closeEditModal() { document.getElementById('edit-modal').classList.add('hidden'); }

        function saveProduct() {
            const id = document.getElementById('edit-id').value;
            const name = document.getElementById('edit-name').value;
            const category = document.getElementById('edit-category').value;
            const price = parseFloat(document.getElementById('edit-price').value) || 0;
            const desc = document.getElementById('edit-desc').value;
            const img = document.getElementById('edit-img').value || 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=500&auto=format&fit=crop';

            if(id) {
                const idx = products.findIndex(x => x.id == id);
                products[idx] = { ...products[idx], name, category, price, desc, img };
            } else {
                products.push({ id: Date.now(), name, category, price, desc, img, isCustomBuilder: false });
            }
            renderProducts();
            closeEditModal();
        }

        function deleteProduct(id) {
            products = products.filter(x => x.id !== id);
            renderProducts();
        }

        function sendWhatsAppOrder() {
            if(cart.length === 0) return alert('El pedido está vacío');
            const date = document.getElementById('order-date').value || 'Por acordar';
            const notes = document.getElementById('order-notes').value || 'Sin observaciones extra';
            const total = cart.reduce((sum, item) => sum + item.price, 0);

            let text = `*¡Hola Paocuppies! Quiero realizar el siguiente pedido:* 🎂✨\n\n`;
            cart.forEach((item, i) => { text += `*${i+1}. ${item.name}* - $${item.price.toFixed(2)}\n   _${item.details}_\n\n`; });
            text += `📅 *Fecha requerida:* ${date}\n`;
            text += `📝 *Detalles / notas:* ${notes}\n`;
            text += `💰 *Total del pedido:* $${total.toFixed(2)} (Pago Móvil Tasa BCV o Divisas)\n\n`;
            text += `Quedo a la espera de su confirmación. ¡Muchas gracias!`;

            window.open(`https://wa.me/584148487778?text=${encodeURIComponent(text)}`, '_blank');
        }

        initApp();
    </script>
</body>
